# Janus M4 firmware — XIAO ESP32-S3 Sense, Track A (std on ESP-IDF): the
# README's sketch, unchanged, over `EspBoard`.
#
# A separate cargo project on purpose (Xtensa target, ESP-IDF build, its own
# toolchain). Build from this directory. See README.md.

[package]
name = "xiao-s3-sense-idf-sketch"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false
description = "Janus M4: the rusty_esp_arduino sketch on the XIAO ESP32-S3 Sense (ESP-IDF track)."

[[bin]]
name = "xiao-s3-sense-idf-sketch"
harness = false # no cargo test harness on the chip

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true
opt-level = "z"
lto = true
codegen-units = 1

[features]
default = ["std", "esp-idf-svc/native"]
std = ["alloc", "esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]

[dependencies]
log = "0.4"
anyhow = "1"
esp-idf-svc = { version = "0.52", default-features = false }
# The camera bindings module (`esp_idf_sys::camera`) is generated from the
# extra component declared below; rusty_esp_image-esp reads it.
esp-idf-sys = "0.37"

# The facade, by path (this repo); the board's peripherals from the image and
# audio packages' chip crates, by git URL (the umbrella's patches point them
# at the sibling checkouts).
rusty_esp_arduino = { path = "../../crates/rusty_esp_arduino", default-features = false }
rusty_esp_core = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", default-features = false, features = ["std"] }
rusty_esp_image-core = { git = "https://github.com/Remade-With-Rust/rusty_esp_image", default-features = false, features = ["std"] }
rusty_esp_image-esp = { git = "https://github.com/Remade-With-Rust/rusty_esp_image", default-features = false, features = ["esp-idf"] }
rusty_esp_audio-core = { git = "https://github.com/Remade-With-Rust/rusty_esp_audio", default-features = false, features = ["std"] }
rusty_esp_audio-esp = { git = "https://github.com/Remade-With-Rust/rusty_esp_audio", default-features = false, features = ["esp-idf"] }

[build-dependencies]
embuild = "0.33"

[package.metadata.esp-idf-sys]
# ESP-IDF v5.5 line, the one esp-idf-svc 0.52 targets.
esp_idf_version = "v5.5.1"
esp_idf_tools_install_dir = "global"

# Espressif's camera driver, bound once. `bindings_module = "camera"` is the
# name rusty_esp_image-esp expects.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp32-camera", version = "^2.0" }
bindings_header = "bindings.h"
bindings_module = "camera"

# A standalone cargo project: not a member of the rusty_esp_arduino workspace
# (cargo needs this table, a glob in workspace.exclude does not match).
[workspace]
