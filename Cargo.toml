[workspace]
resolver = "3"
members = ["crates/*"]
# Per-chip firmware sketches are their own cargo projects: each needs its own
# target, linker script and (for Xtensa) toolchain. They are never workspace
# members. See firmware/README.md.
exclude = ["firmware/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/rusty_esp_arduino"
homepage = "https://www.mata.network/"
authors = ["Remade With Rust"]
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
# Siblings in the Janus family are consumed BY GIT URL so this repo deploys on
# its own. Inside the Janus umbrella folder, `.cargo/config.toml` patches the
# URL to the sibling checkout, so local edits are visible without a push.
rusty_esp_core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_core", default-features = false }
rusty_esp_image-core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_image", default-features = false }
rusty_esp_video-core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_video", default-features = false }
rusty_esp_video-esp = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_video", default-features = false }
rusty_esp_audio-core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_audio", default-features = false }
# identity::begin (the device key and its DID) and, behind `mesh`, the node.
rusty_esp_mid-core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_mid", default-features = false }
# radar::read (the one presence record every presence sensor answers in).
# 0.2: `rusty_esp_signal-esp` dropped `EspNowLink`'s lifetime when
# esp-radio beta.1 removed it from the ESP-NOW halves. A breaking change
# on a 0.x crate bumps the MINOR, and the signal set versions in lockstep,
# so -core moves with it even though -core itself did not break.
rusty_esp_signal-core = { version = "0.2", git = "https://github.com/Remade-With-Rust/rusty_esp_signal", default-features = false }
rusty_esp_iroh-core = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_iroh", default-features = false }
rusty_esp_iroh-host = { version = "0.1", git = "https://github.com/Remade-With-Rust/rusty_esp_iroh", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
