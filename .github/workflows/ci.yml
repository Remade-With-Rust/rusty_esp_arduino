name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sibling Janus repos are consumed by git URL and are PRIVATE until each is
  # market-ready. Cargo fetches them through the git CLI, which honours the
  # token rewrite below. Set the repository secret JANUS_GIT_TOKEN to a
  # fine-grained PAT (or GitHub App token) with read access to the siblings.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  JANUS_GIT_TOKEN: ${{ secrets.JANUS_GIT_TOKEN }}

# No no_std job: the facade is the std (Track A) sketch surface by design —
# the same code runs on the laptop and on ESP-IDF. The function packages it
# wraps carry the bare-metal gates.
jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Every other job resolves from the committed Cargo.lock, so a sibling
  # releasing a new MINOR cannot break them: the breakage waits, invisible,
  # until someone edits a manifest and forces a re-resolve. In
  # rusty_esp_sense it waited weeks while CI stayed green and the repo was
  # unbuildable by anyone without a local Janus checkout.
  #
  # This job throws the lock away and resolves from scratch, so that drift
  # surfaces on the day it happens. It does not build: resolution is the
  # whole question, and `cargo metadata` answers it in seconds.
  resolve:
    name: resolve without the lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: resolve from scratch
        run: |
          rm -f Cargo.lock
          cargo metadata --format-version 1 > /dev/null

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check
