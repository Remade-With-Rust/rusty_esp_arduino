[package]
name = "rusty_esp_arduino"
description = "The Arduino-shaped sketch facade over the Janus function packages: setup/loop, wifi::begin, cam::grab, mic::read, stream::push. Thin by law — every function is one call into rusty_esp_video / rusty_esp_audio through a Board seam, and the same sketch runs on the laptop (HostBoard) and on the chip."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_esp_arduino"
keywords = ["esp32", "arduino", "embedded", "mata", "remade-with-rust"]
categories = ["embedded", "hardware-support", "multimedia"]

[features]
default = ["host"]
# The laptop board: a test-pattern or JPEG-directory camera, a tone or WAV
# microphone, the same stream code the chip runs. Off in a firmware.
host = ["dep:rusty_esp_image-core", "dep:rusty_jpeg"]

[dependencies]
rusty_esp_core = { workspace = true, features = ["std"] }
rusty_esp_video-core = { workspace = true, features = ["std"] }
rusty_esp_video-esp = { workspace = true, features = ["std"] }
rusty_esp_audio-core = { workspace = true, features = ["std"] }
rusty_esp_image-core = { workspace = true, features = ["std"], optional = true }
rusty_jpeg = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# The board records under boards/ are TOML; the test that holds them to the
# schema parses them here and nowhere else.
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[example]]
name = "cam_mic"
required-features = ["host"]

[lints]
workspace = true
